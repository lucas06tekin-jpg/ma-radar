<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Din Finans App">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Din Finans App</title>
<style>
  /* Tidningsdesign: vitt papper, serifrubriker, tunna svarta linjer */
  :root { --bg:#fff; --card:#f4f2ee; --text:#1a1a1a; --muted:#6b6b6b; --line:#d9d6d0; --ink:#111;
          --good:#1a7f4b; --neutral:#a86a00; --bad:#b3261e; --accent:#0a6fa8;
          --tint:rgba(0,0,0,.035); --tint2:rgba(0,0,0,.06); --good-bg:rgba(26,127,75,.10); --bad-bg:rgba(179,38,30,.09); --accent-bg:rgba(10,111,168,.09);
          --serif:Georgia,"Times New Roman",Times,serif; --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  @media (prefers-color-scheme:dark) {
    :root { --bg:#121212; --card:#1d1d1d; --text:#ececec; --muted:#9a9a9a; --line:#333; --ink:#f2f2f2;
            --good:#4cc38a; --neutral:#e0a63a; --bad:#f2766d; --accent:#5ab4e8;
            --tint:rgba(255,255,255,.05); --tint2:rgba(255,255,255,.08); --good-bg:rgba(76,195,138,.15); --bad-bg:rgba(242,118,109,.15); --accent-bg:rgba(90,180,232,.14); }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:16px/1.5 var(--sans);
         padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { position:sticky; top:0; z-index:5; background:var(--bg); padding:8px 16px 0; border-bottom:1px solid var(--ink); box-shadow:0 3px 0 -2px var(--bg), 0 4px 0 -2px var(--ink); }
  .topline { display:flex; justify-content:space-between; align-items:center; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--line); padding-bottom:6px; }
  h1 { margin:6px 0 4px; text-align:center; font:700 30px/1.1 var(--serif); letter-spacing:-.01em; color:var(--ink); }
  #bell { background:none; border:1px solid var(--ink); color:var(--ink); border-radius:2px; padding:3px 9px; font:600 11px var(--sans); letter-spacing:.06em; text-transform:uppercase; }
  #bell.on { background:var(--ink); color:var(--bg); }
  .filters { display:flex; gap:8px; padding:10px 0; overflow-x:auto; }
  .chip { flex:none; background:none; border:1px solid var(--line); color:var(--muted); border-radius:2px; padding:4px 11px; font-size:12px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; }
  .chip.active { color:var(--bg); background:var(--ink); border-color:var(--ink); }
  main { padding:12px 16px 40px; max-width:720px; margin:0 auto; }
  .banner { background:var(--card); border:1px solid var(--line); border-radius:2px; padding:12px; margin-bottom:12px; font-size:14px; color:var(--muted); }
  .card { background:none; border:0; border-bottom:1px solid var(--line); border-radius:0; padding:16px 0; margin-bottom:0; }
  .card.hl { background:var(--accent-bg); padding-left:10px; padding-right:10px; }
  .top { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .names { font:700 20px/1.25 var(--serif); color:var(--ink); }
  .val { color:var(--accent); font-weight:600; white-space:nowrap; }
  .meta { color:var(--muted); font-size:11px; letter-spacing:.05em; text-transform:uppercase; margin:4px 0 8px; }
  .sum { margin:0 0 10px; }
  .verdicts { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .v { border-radius:0; padding:8px 10px; background:var(--tint); font-size:13px; border-left:4px solid var(--neutral); }
  .v.good { border-color:var(--good); } .v.bad { border-color:var(--bad); }
  .v b { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .v .t { font-weight:700; }
  .v.good .t { color:var(--good); } .v.bad .t { color:var(--bad); } .v.neutral .t { color:var(--neutral); }
  .deep { margin-top:10px; border-top:1px solid var(--line); padding-top:8px; }
  .deep summary { cursor:pointer; color:var(--accent); font-weight:600; font-size:14px; }
  .deep .src { color:var(--muted); font-weight:400; font-size:12px; }
  .deep p { margin:8px 0 0; font-size:14px; }
  a { color:var(--accent); font-size:13px; }
  .empty { text-align:center; color:var(--muted); padding:40px 0; }
  footer { text-align:center; color:var(--muted); font-size:11px; padding:0 16px 20px; }
  [hidden] { display:none !important; }
  .tabs { display:flex; gap:0; margin-top:2px; overflow-x:auto; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { flex:1 0 auto; white-space:nowrap; background:none; border:0; border-bottom:3px solid transparent; color:var(--muted); border-radius:0; padding:10px 11px 7px; font:600 12px var(--sans); letter-spacing:.06em; text-transform:uppercase; }
  .tab span { display:none; }
  .tab.active { color:var(--ink); border-bottom-color:var(--ink); }

  /* Quiz */
  .qh { margin:0 0 4px; font:700 26px/1.2 var(--serif); color:var(--ink); }
  .qsub { margin:0 0 14px; color:var(--muted); font-size:14px; }
  .qstats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; }
  .qstats div { background:var(--tint); border-radius:2px; padding:10px 6px; text-align:center; }
  .qstats b { display:block; font-size:22px; color:var(--accent); }
  .qstats span { font-size:11px; color:var(--muted); }
  .qlabel { margin:12px 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  .qchips { display:flex; flex-wrap:wrap; gap:8px; }
  .qbtn { display:block; width:100%; margin-top:14px; min-height:50px; border-radius:2px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:16px; font-weight:600; }
  .qbtn.primary { background:var(--accent); border-color:var(--accent); color:var(--bg); }
  .qbtn.ghost { background:none; color:var(--muted); font-weight:400; font-size:14px; min-height:40px; }
  .qbtn:disabled { opacity:.5; }
  .qprog { display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin-bottom:6px; }
  .qbar { height:6px; background:var(--card); border-radius:2px; overflow:hidden; margin-bottom:12px; }
  .qbar i { display:block; height:100%; background:var(--accent); transition:width .3s; }
  .qcard { padding:18px 14px; }
  .qcat { text-align:center; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .qabbr { text-align:center; font-family:var(--serif); font-size:44px; font-weight:700; letter-spacing:.02em; margin:6px 0 2px; word-break:break-word; }
  .qask { text-align:center; color:var(--muted); margin-bottom:14px; font-size:14px; }
  .qopts { display:grid; gap:10px; }
  .qopt { text-align:left; min-height:54px; padding:12px 14px; border-radius:2px; border:1px solid var(--line); background:var(--tint); color:var(--text); font-size:16px; line-height:1.3; }
  .qopt:active:not(:disabled) { border-color:var(--accent); }
  .qopt.right { border-color:var(--good); background:var(--good-bg); }
  .qopt.wrong { border-color:var(--bad); background:var(--bad-bg); }
  .qopt:disabled { color:var(--text); }
  .qinput { display:block; width:100%; min-height:54px; padding:12px 14px; border-radius:2px; border:1px solid var(--line); background:var(--tint); color:var(--text); font:inherit; font-size:17px; } /* 16px+ hindrar iOS från att zooma */
  .qinput:focus { outline:none; border-color:var(--accent); }
  .qinput.right { border-color:var(--good); background:var(--good-bg); }
  .qinput.wrong { border-color:var(--bad); background:var(--bad-bg); }
  .qinput:disabled { color:var(--text); opacity:1; -webkit-text-fill-color:var(--text); }
  .qlink { background:none; border:none; padding:10px 0 0; color:var(--accent); font-size:14px; text-decoration:underline; }
  .qfb { margin-top:14px; border-radius:2px; padding:12px; background:var(--tint); border-left:4px solid var(--good); }
  .qfb.no { border-color:var(--bad); }
  .qfull { font-weight:700; margin-top:4px; }
  .qfb p { margin:6px 0 0; font-size:14px; }
  .qwrongnote { color:var(--muted); }
  .qwrongnote span { opacity:.8; }
  .qmiss { padding:10px 0; border-top:1px solid var(--line); font-size:14px; }
  .qmiss b { color:var(--accent); margin-right:6px; }
  .qmiss span { display:block; color:var(--muted); font-size:13px; margin-top:2px; }
  /* Ordlista */
  .gchips { margin:10px 0 4px; }
  .gcount { font-size:12px; color:var(--muted); margin:8px 0 4px; }
  .gletter { position:sticky; top:116px; z-index:2; margin:10px 0 6px; padding:4px 0; background:var(--bg); font-size:13px; font-weight:700; color:var(--accent); letter-spacing:.08em; }
  .gitem { background:var(--card); border:1px solid var(--line); border-radius:2px; padding:10px 12px; margin-bottom:8px; }
  .ghead { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .gabbr { font:700 19px var(--serif); color:var(--accent); word-break:break-word; }
  .gcat { font-size:11px; color:var(--muted); text-align:right; }
  .gfull { font-weight:600; margin-top:2px; }
  .gexp { margin:4px 0 0; font-size:14px; color:var(--muted); }
  .grow { display:flex; justify-content:space-between; align-items:center; }
  .gbar { display:flex; gap:8px; margin:6px 0 8px; }
  .gpanel { background:var(--card); border:1px solid var(--accent); border-radius:2px; padding:12px; margin:8px 0 12px; display:grid; gap:10px; }
  .gpanel .qbtn { margin-top:0; }
  .gpanel textarea.qinput { resize:vertical; font-family:inherit; }
  .gremember { font-size:13px; color:var(--muted); display:flex; align-items:center; gap:8px; }
  .gflash { background:var(--accent-bg); border:1px solid var(--accent); border-radius:2px; padding:8px 12px; margin:8px 0; font-size:14px; }
  .gtools { display:flex; gap:16px; margin-top:4px; }
  .gtools .qlink { padding:6px 0 0; font-size:13px; }
  .qlink.danger { color:var(--bad); }
  /* Nyheter */
  .nfilters { margin-top:12px; }
  .ncard { padding:12px; }
  .nmeta { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; font-size:12px; color:var(--muted); }
  .nmeta b { color:var(--text); font-size:13px; }
  .npill { padding:1px 8px; border-radius:2px; font-size:11px; font-weight:700; border:1px solid var(--line); }
  .npill.paid { color:var(--neutral); border-color:var(--neutral); }
  .npill.big { color:var(--bg); background:var(--bad); border-color:var(--bad); }
  .npill.imp { color:var(--accent); border-color:var(--accent); }
  .ntitle { display:block; margin:6px 0 4px; font:700 19px/1.3 var(--serif); color:var(--ink); text-decoration:none; }
  .nsum { margin:0 0 6px; font-size:14px; color:var(--muted); }
  .ntags { display:flex; flex-wrap:wrap; gap:6px; }
  .ntags span { font-size:11px; padding:2px 8px; border-radius:2px; background:var(--tint2); color:var(--muted); }
  .nnotehead { width:100%; display:flex; justify-content:space-between; align-items:center; padding:12px 14px; background:none; border:none; color:var(--text); font-size:15px; }
  .nnotebody { padding:0 14px 14px; border-top:1px solid var(--line); }
  .nchev { color:var(--muted); font-size:12px; }
  /* Jobb */
  .jrow { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .jrow select { min-height:46px; padding:8px 10px; font-size:15px; }
  .jurgent { color:var(--bad) !important; }
  .jlinks { display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:8px; }
  .jlinks a { font-size:13px; }
  .jcareerlinks { display:flex; flex-wrap:wrap; gap:8px; }
  .jcareerlinks a { padding:6px 12px; border:1px solid var(--line); border-radius:2px; font-size:13px; color:var(--text); text-decoration:none; background:var(--card); }
  /* Jobbspårare */
  .tseg { margin-bottom:12px; }
  .tseg .chip { flex:1; text-align:center; padding:9px 6px; font-size:14px; }
  .jstar { background:none; border:1px solid var(--line); color:var(--text); border-radius:2px; padding:3px 12px; font-size:13px; }
  .jstar.on { border-color:var(--neutral); color:var(--neutral); }
  .tbar { display:flex; gap:8px; margin-bottom:10px; }
  .tcard { border-left:4px solid var(--line); }
  .tcard.s-saved { border-left-color:var(--accent); }
  .tcard.s-applied { border-left-color:var(--neutral); }
  .tcard.s-interview { border-left-color:#c084fc; }
  .tcard.s-offer { border-left-color:var(--good); }
  .tcard.s-rejected, .tcard.s-withdrawn { border-left-color:var(--bad); opacity:.8; }
  .tchips { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; }
  .tchip { font-size:12px; padding:2px 9px; border-radius:2px; background:var(--tint2); color:var(--muted); }
  .tchip.urgent { background:var(--bad-bg); color:var(--bad); }
  .tnotes { white-space:pre-wrap; }
  .trow { display:flex; align-items:center; gap:14px; margin-top:6px; }
  .tstatus { width:auto; min-height:38px; padding:4px 8px; font-size:14px; flex:none; }
  .tlinkrow { display:flex; gap:8px; align-items:center; }
  .tlinkrow .qinput { flex:1; min-width:0; }
  .tlabel { display:grid; gap:4px; font-size:12px; color:var(--muted); }
  .tlabel .qinput { min-height:46px; }
  /* Quizpåminnelse */
  .rtimes { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .rtime { display:flex; align-items:center; gap:8px; }
  .rtime span { width:20px; color:var(--muted); font-size:13px; text-align:center; }
  .rtime input { min-height:48px; padding:8px 10px; flex:1; min-width:0; }
  /* Intervjuträning */
  .iqsec { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .iqq { font:700 21px/1.35 var(--serif); margin:6px 0 12px; }
  .iqarea { min-height:140px; resize:vertical; font-family:inherit; line-height:1.4; }
  .iqblock { margin-top:12px; padding:10px 12px; border-radius:2px; background:var(--tint); border-left:4px solid var(--muted); }
  .iqblock.book { border-color:var(--accent); }
  .iqblock h4 { margin:0 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  .iqblock p { margin:0 0 8px; font-size:15px; white-space:pre-wrap; }
  .iqblock p:last-child { margin-bottom:0; }
  .iqrate { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
  .iqrate button { min-height:52px; border-radius:2px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:14px; font-weight:600; }
  .iqrate button.picked { border-color:var(--accent); background:var(--accent-bg); }
  .iqprev { font-size:13px; color:var(--muted); margin:0 0 10px; }
  .iqdots { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .iqnote { font-size:12px; color:var(--muted); margin-top:12px; }
  @media (max-width:420px){ .verdicts{grid-template-columns:1fr;} .qabbr{font-size:38px;} }
</style>
</head>
<body>
<header>
  <div class="topline"><span id="today"></span><button id="bell">Notiser</button></div>
  <h1>Din Finans App</h1>
  <nav class="tabs">
    <button class="tab active" data-view="deals">Affärer</button>
    <button class="tab" data-view="news">Nyheter</button>
    <button class="tab" data-view="jobs">Jobb</button>
    <button class="tab" data-view="quiz">Quiz</button>
    <button class="tab" data-view="glossary">Ordlista</button>
    <button class="tab" data-view="interview">Intervju</button>
  </nav>
  <div class="filters" id="filters">
    <button class="chip active" data-min="1">Alla</button>
    <button class="chip" data-min="3">Viktiga</button>
    <button class="chip" data-min="5">Megaaffärer</button>
    <button class="chip" id="se">🇸🇪 Sverige</button>
  </div>
</header>
<main id="view-deals">
  <div id="banner"></div>
  <div id="list"><div class="empty">Laddar affärer…</div></div>
</main>
<main id="view-news" hidden></main>
<main id="view-jobs" hidden></main>
<main id="view-quiz" hidden></main>
<main id="view-glossary" hidden></main>
<main id="view-interview" hidden></main>
<footer>AI-genererade sammanfattningar och bedömningar – inte finansiell rådgivning.</footer>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="quiz-data.js"></script>
<script src="terms.js"></script>
<script src="push.js"></script>
<script src="news.js"></script>
<script src="tracker.js"></script>
<script src="jobs.js"></script>
<script src="quiz.js"></script>
<script src="reminder.js"></script>
<script src="glossary.js"></script>
<script src="interview.js"></script>
<script src="tabs.js"></script>
<script>try{document.getElementById('today').textContent=new Date().toLocaleDateString('sv-SE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}catch(e){}</script>
</body>
</html>
