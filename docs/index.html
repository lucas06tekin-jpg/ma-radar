<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Din Finans App">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Din Finans App</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --line:#334155;
          --good:#34d399; --neutral:#fbbf24; --bad:#f87171; --accent:#38bdf8; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { position:sticky; top:0; z-index:5; background:rgba(15,23,42,.92); backdrop-filter:blur(10px);
           padding:14px 16px 10px; border-bottom:1px solid var(--line); }
  h1 { margin:0; font-size:22px; display:flex; justify-content:space-between; align-items:center; }
  #bell { background:none; border:1px solid var(--line); color:var(--text); border-radius:20px; padding:6px 12px; font-size:14px; }
  #bell.on { border-color:var(--good); color:var(--good); }
  .filters { display:flex; gap:8px; margin-top:10px; overflow-x:auto; }
  .chip { flex:none; background:var(--card); border:1px solid var(--line); color:var(--muted); border-radius:16px; padding:5px 12px; font-size:13px; }
  .chip.active { color:var(--bg); background:var(--accent); border-color:var(--accent); }
  main { padding:12px 16px 40px; max-width:720px; margin:0 auto; }
  .banner { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px; font-size:14px; color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  .card.hl { border-color:var(--accent); }
  .top { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .names { font-weight:700; font-size:17px; }
  .val { color:var(--accent); font-weight:600; white-space:nowrap; }
  .meta { color:var(--muted); font-size:12px; margin:2px 0 8px; }
  .sum { margin:0 0 10px; }
  .verdicts { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .v { border-radius:10px; padding:8px; background:rgba(255,255,255,.04); font-size:13px; border-left:4px solid var(--neutral); }
  .v.good { border-color:var(--good); } .v.bad { border-color:var(--bad); }
  .v b { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .v .t { font-weight:700; }
  .v.good .t { color:var(--good); } .v.bad .t { color:var(--bad); } .v.neutral .t { color:var(--neutral); }
  .deep { margin-top:10px; border-top:1px solid var(--line); padding-top:8px; }
  .deep summary { cursor:pointer; color:var(--accent); font-weight:600; font-size:14px; }
  .deep .src { color:var(--muted); font-weight:400; font-size:12px; }
  .deep p { margin:8px 0 0; font-size:14px; }
  a { color:var(--accent); font-size:13px; }
  .empty { text-align:center; color:var(--muted); padding:40px 0; }
  footer { text-align:center; color:var(--muted); font-size:11px; padding:0 16px 20px; }
  [hidden] { display:none !important; }
  .tabs { display:flex; gap:6px; margin-top:10px; overflow-x:auto; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; gap:1px; white-space:nowrap; background:var(--card); border:1px solid var(--line); color:var(--muted); border-radius:10px; padding:6px 2px; font-size:12px; font-weight:600; line-height:1.2; }
  .tab span { font-size:18px; line-height:1.1; }
  .tab.active { color:var(--text); border-color:var(--accent); box-shadow:inset 0 -3px 0 var(--accent); }

  /* Quiz */
  .qh { margin:0 0 4px; font-size:22px; }
  .qsub { margin:0 0 14px; color:var(--muted); font-size:14px; }
  .qstats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; }
  .qstats div { background:rgba(255,255,255,.04); border-radius:10px; padding:10px 6px; text-align:center; }
  .qstats b { display:block; font-size:22px; color:var(--accent); }
  .qstats span { font-size:11px; color:var(--muted); }
  .qlabel { margin:12px 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  .qchips { display:flex; flex-wrap:wrap; gap:8px; }
  .qbtn { display:block; width:100%; margin-top:14px; min-height:50px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:16px; font-weight:600; }
  .qbtn.primary { background:var(--accent); border-color:var(--accent); color:var(--bg); }
  .qbtn.ghost { background:none; color:var(--muted); font-weight:400; font-size:14px; min-height:40px; }
  .qbtn:disabled { opacity:.5; }
  .qprog { display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin-bottom:6px; }
  .qbar { height:6px; background:var(--card); border-radius:3px; overflow:hidden; margin-bottom:12px; }
  .qbar i { display:block; height:100%; background:var(--accent); transition:width .3s; }
  .qcard { padding:18px 14px; }
  .qcat { text-align:center; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .qabbr { text-align:center; font-size:44px; font-weight:800; letter-spacing:.02em; margin:6px 0 2px; word-break:break-word; }
  .qask { text-align:center; color:var(--muted); margin-bottom:14px; font-size:14px; }
  .qopts { display:grid; gap:10px; }
  .qopt { text-align:left; min-height:54px; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--text); font-size:16px; line-height:1.3; }
  .qopt:active:not(:disabled) { border-color:var(--accent); }
  .qopt.right { border-color:var(--good); background:rgba(52,211,153,.15); }
  .qopt.wrong { border-color:var(--bad); background:rgba(248,113,113,.15); }
  .qopt:disabled { color:var(--text); }
  .qinput { display:block; width:100%; min-height:54px; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--text); font:inherit; font-size:17px; } /* 16px+ hindrar iOS från att zooma */
  .qinput:focus { outline:none; border-color:var(--accent); }
  .qinput.right { border-color:var(--good); background:rgba(52,211,153,.15); }
  .qinput.wrong { border-color:var(--bad); background:rgba(248,113,113,.15); }
  .qinput:disabled { color:var(--text); opacity:1; -webkit-text-fill-color:var(--text); }
  .qlink { background:none; border:none; padding:10px 0 0; color:var(--accent); font-size:14px; text-decoration:underline; }
  .qfb { margin-top:14px; border-radius:12px; padding:12px; background:rgba(255,255,255,.04); border-left:4px solid var(--good); }
  .qfb.no { border-color:var(--bad); }
  .qfull { font-weight:700; margin-top:4px; }
  .qfb p { margin:6px 0 0; font-size:14px; }
  .qwrongnote { color:var(--muted); }
  .qwrongnote span { opacity:.8; }
  .qmiss { padding:10px 0; border-top:1px solid var(--line); font-size:14px; }
  .qmiss b { color:var(--accent); margin-right:6px; }
  .qmiss span { display:block; color:var(--muted); font-size:13px; margin-top:2px; }
  /* Ordlista */
  .gchips { margin:10px 0 4px; }
  .gcount { font-size:12px; color:var(--muted); margin:8px 0 4px; }
  .gletter { position:sticky; top:106px; z-index:2; margin:10px 0 6px; padding:4px 0; background:var(--bg); font-size:13px; font-weight:700; color:var(--accent); letter-spacing:.08em; }
  .gitem { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; }
  .ghead { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .gabbr { font-size:18px; color:var(--accent); word-break:break-word; }
  .gcat { font-size:11px; color:var(--muted); text-align:right; }
  .gfull { font-weight:600; margin-top:2px; }
  .gexp { margin:4px 0 0; font-size:14px; color:var(--muted); }
  .grow { display:flex; justify-content:space-between; align-items:center; }
  .gbar { display:flex; gap:8px; margin:6px 0 8px; }
  .gpanel { background:var(--card); border:1px solid var(--accent); border-radius:14px; padding:12px; margin:8px 0 12px; display:grid; gap:10px; }
  .gpanel .qbtn { margin-top:0; }
  .gpanel textarea.qinput { resize:vertical; font-family:inherit; }
  .gremember { font-size:13px; color:var(--muted); display:flex; align-items:center; gap:8px; }
  .gflash { background:rgba(56,189,248,.12); border:1px solid var(--accent); border-radius:10px; padding:8px 12px; margin:8px 0; font-size:14px; }
  .gtools { display:flex; gap:16px; margin-top:4px; }
  .gtools .qlink { padding:6px 0 0; font-size:13px; }
  .qlink.danger { color:var(--bad); }
  /* Intervjuträning */
  .iqsec { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .iqq { font-size:19px; font-weight:700; line-height:1.35; margin:6px 0 12px; }
  .iqarea { min-height:140px; resize:vertical; font-family:inherit; line-height:1.4; }
  .iqblock { margin-top:12px; padding:10px 12px; border-radius:12px; background:rgba(255,255,255,.04); border-left:4px solid var(--muted); }
  .iqblock.book { border-color:var(--accent); }
  .iqblock h4 { margin:0 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  .iqblock p { margin:0 0 8px; font-size:15px; white-space:pre-wrap; }
  .iqblock p:last-child { margin-bottom:0; }
  .iqrate { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
  .iqrate button { min-height:52px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:14px; font-weight:600; }
  .iqrate button.picked { border-color:var(--accent); background:rgba(56,189,248,.15); }
  .iqprev { font-size:13px; color:var(--muted); margin:0 0 10px; }
  .iqdots { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .iqnote { font-size:12px; color:var(--muted); margin-top:12px; }
  @media (max-width:420px){ .verdicts{grid-template-columns:1fr;} .qabbr{font-size:38px;} }
</style>
</head>
<body>
<header>
  <h1>Din Finans App <button id="bell">🔔 Notiser</button></h1>
  <nav class="tabs">
    <button class="tab active" data-view="deals"><span>📰</span>Affärer</button>
    <button class="tab" data-view="quiz"><span>🧠</span>Quiz</button>
    <button class="tab" data-view="glossary"><span>📖</span>Ordlista</button>
    <button class="tab" data-view="interview"><span>🎤</span>Intervju</button>
  </nav>
  <div class="filters" id="filters">
    <button class="chip active" data-min="1">Alla</button>
    <button class="chip" data-min="3">Viktiga</button>
    <button class="chip" data-min="5">Megaaffärer</button>
    <button class="chip" id="se">🇸🇪 Sverige</button>
  </div>
</header>
<main id="view-deals">
  <div id="banner"></div>
  <div id="list"><div class="empty">Laddar affärer…</div></div>
</main>
<main id="view-quiz" hidden></main>
<main id="view-glossary" hidden></main>
<main id="view-interview" hidden></main>
<footer>AI-genererade sammanfattningar och bedömningar – inte finansiell rådgivning.</footer>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="quiz-data.js"></script>
<script src="terms.js"></script>
<script src="quiz.js"></script>
<script src="glossary.js"></script>
<script src="interview.js"></script>
<script src="tabs.js"></script>
</body>
</html>
